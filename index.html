<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyChat</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1d4ed8;
        --bg-3: #8b5cf6;
        --panel: rgba(15, 23, 42, 0.84);
        --panel-light: rgba(148, 163, 184, 0.1);
        --card: rgba(15, 23, 42, 0.7);
        --line: rgba(255, 255, 255, 0.08);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --danger: #f87171;
        --warning: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .auth-box {
        width: min(100%, 420px);
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 30px 80px rgba(15, 23, 42, 0.45);
        padding: 32px 28px;
        text-align: center;
      }

      .auth-icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(139, 92, 246, 0.2));
        font-size: 32px;
      }

      .auth-box h1 {
        margin: 0 0 8px;
        font-size: clamp(1.8rem, 5vw, 2.5rem);
      }

      .auth-box p {
        margin: 0 0 22px;
        color: var(--muted);
      }

      .auth-box input {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text);
        border-radius: 12px;
        font-size: 1rem;
        padding: 14px 16px;
        outline: none;
      }

      .auth-box input:focus {
        border-color: rgba(56, 189, 248, 0.8);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      }

      .auth-box button,
      .toolbar button,
      .send-btn,
      .ghost-btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .auth-box button:hover,
      .toolbar button:hover,
      .send-btn:hover,
      .ghost-btn:hover {
        transform: translateY(-1px);
      }

      .auth-box button {
        width: 100%;
        margin-top: 16px;
        background: linear-gradient(135deg, var(--accent), var(--bg-3));
        color: white;
        font-size: 1.02rem;
        font-weight: 700;
        padding: 14px 16px;
      }

      .error {
        min-height: 22px;
        margin-top: 12px;
        color: #fca5a5;
        font-size: 0.92rem;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .error.show {
        opacity: 1;
      }

      .chat-app {
        width: min(100%, 1200px);
        height: min(92vh, 880px);
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(20px);
        border: 1px solid var(--line);
        border-radius: 26px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(4, 10, 25, 0.5);
      }

      .sidebar {
        background: rgba(15, 23, 42, 0.95);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 18px;
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .brand-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--bg-3));
      }

      .profile-box {
        padding: 18px 18px 12px;
      }

      .profile-card {
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(139, 92, 246, 0.1));
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f9a8d4, #a78bfa);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #0f172a;
      }

      .identity {
        flex: 1;
      }

      .identity strong {
        display: block;
        font-size: 0.95rem;
      }

      .identity small {
        color: var(--muted);
      }

      .contacts {
        list-style: none;
        padding: 10px 12px 0;
        margin: 0;
        overflow-y: auto;
      }

      .contacts li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 10px;
        border-radius: 12px;
        color: var(--text);
        margin-bottom: 8px;
        background: rgba(148, 163, 184, 0.04);
        border: 1px solid transparent;
      }

      .contacts li.active {
        background: rgba(56, 189, 248, 0.08);
        border-color: rgba(56, 189, 248, 0.2);
      }

      .contact-name {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .online-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
      }

      .panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.76);
      }

      .contact-meta h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .contact-meta p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .ghost-btn {
        padding: 10px 14px;
        background: rgba(148, 163, 184, 0.08);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .ghost-btn.on {
        background: rgba(34, 197, 94, 0.12);
        border-color: rgba(34, 197, 94, 0.4);
        color: #dcfce7;
      }

      .video-box {
        margin: 14px 16px 0;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.7);
        display: none;
      }

      .video-box.show {
        display: block;
      }

      .video-box video {
        width: 100%;
        height: 220px;
        object-fit: cover;
        background: #0f172a;
        display: block;
      }

      .video-badges {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 8px 12px 10px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 10px;
        background: rgba(56, 189, 248, 0.12);
        color: #bae6fd;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 22px 18px 8px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.15), rgba(15, 23, 42, 0.32));
      }

      .message-row {
        display: flex;
        margin-bottom: 14px;
      }

      .message-row.self {
        justify-content: flex-end;
      }

      .bubble {
        max-width: min(68%, 420px);
        padding: 12px 14px 10px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(148, 163, 184, 0.08);
      }

      .message-row.self .bubble {
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(139, 92, 246, 0.18));
      }

      .sender {
        font-size: 0.76rem;
        font-weight: 700;
        color: #bfdbfe;
        margin-bottom: 5px;
      }

      .text {
        font-size: 0.96rem;
        line-height: 1.45;
        word-break: break-word;
      }

      .time {
        margin-top: 6px;
        font-size: 0.68rem;
        color: var(--muted);
        text-align: right;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding: 16px 18px 18px;
        border-top: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.7);
      }

      .composer input {
        flex: 1;
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
      }

      .composer input:focus {
        border-color: rgba(56, 189, 248, 0.8);
      }

      .send-btn {
        padding: 13px 18px;
        background: linear-gradient(135deg, var(--accent), var(--bg-3));
        color: white;
        font-weight: 700;
      }

      .note {
        margin-top: 12px;
        font-size: 0.72rem;
        color: var(--muted);
        line-height: 1.5;
      }

      @media (max-width: 860px) {
        .chat-app {
          grid-template-columns: 1fr;
          height: auto;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="screen active" id="authScreen">
      <div class="auth-box">
        <div class="auth-icon">🔒</div>
        <h1>SkyChat</h1>
        <p>Enter the access code to continue</p>
        <input id="codeInput" type="password" placeholder="Enter access code" autocomplete="off" />
        <button id="enterBtn">Enter</button>
        <div class="error" id="errorMessage">Incorrect code. Try again.</div>
      </div>
    </div>

    <div class="screen" id="chatScreen">
      <div class="chat-app">
        <aside class="sidebar">
          <div class="brand">
            <span>SKYCHAT</span>
            <span class="brand-badge">💬</span>
          </div>

          <div class="profile-box">
            <div class="profile-card">
              <div class="avatar" id="avatarInitials">Y</div>
              <div class="identity">
                <strong id="userName">You</strong>
                <small>Online</small>
              </div>
            </div>
          </div>

          <ul class="contacts">
            <li class="active">
              <div class="contact-name"><span class="online-dot"></span> Adriana</div>
              <span>2m</span>
            </li>
            <li>
              <div class="contact-name"><span class="online-dot"></span> Marcus</div>
              <span>3m</span>
            </li>
            <li>
              <div class="contact-name"><span class="online-dot"></span> Liam</div>
              <span>1h</span>
            </li>
          </ul>
        </aside>

        <main class="panel">
          <header class="topbar">
            <div class="contact-meta">
              <h2>Adriana</h2>
              <p>Active now</p>
            </div>

            <div class="toolbar">
              <button class="ghost-btn" id="callBtn">Call</button>
              <button class="ghost-btn" id="videoBtn">Camera</button>
              <button class="ghost-btn" id="muteBtn">Mute</button>
            </div>
          </header>

          <div class="video-box" id="videoBox">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="video-badges">
              <span class="pill" id="callPill">Live call</span>
              <span id="mediaState">Mic on</span>
            </div>
          </div>

          <section class="messages" id="messages"></section>

          <div class="composer">
            <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off" />
            <button class="send-btn" id="sendBtn">Send</button>
          </div>
        </main>
      </div>
    </div>

    <script>
      const ACCESS_CODE = 'HadrianIsGay';
      const STORAGE_KEY = 'skychat-messages';

      const authScreen = document.getElementById('authScreen');
      const chatScreen = document.getElementById('chatScreen');
      const codeInput = document.getElementById('codeInput');
      const errorMessage = document.getElementById('errorMessage');
      const messagesWrap = document.getElementById('messages');
      const messageInput = document.getElementById('messageInput');
      const userName = document.getElementById('userName');
      const avatarInitials = document.getElementById('avatarInitials');
      const videoBox = document.getElementById('videoBox');
      const localVideo = document.getElementById('localVideo');
      const videoBtn = document.getElementById('videoBtn');
      const muteBtn = document.getElementById('muteBtn');
      const callBtn = document.getElementById('callBtn');
      const mediaState = document.getElementById('mediaState');

      let localStream = null;
      let micMuted = false;
      let cameraOn = false;
      let callActive = false;

      const seedMessages = [
        { id: 1, sender: 'Adriana', text: 'Hey, are you free later?', time: '09:12 AM', self: false },
        { id: 2, sender: 'You', text: 'Yep! I can call after 7.', time: '09:13 AM', self: true },
        { id: 3, sender: 'Adriana', text: 'Perfect. See you then.', time: '09:14 AM', self: false }
      ];

      function readMessages() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seedMessages));
          return [...seedMessages];
        }

        try {
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) && parsed.length ? parsed : [...seedMessages];
        } catch (error) {
          return [...seedMessages];
        }
      }

      let messages = readMessages();

      function renderMessages() {
        messagesWrap.innerHTML = '';
        messages.forEach((msg) => {
          const row = document.createElement('div');
          row.className = 'message-row' + (msg.self ? ' self' : '');

          const bubble = document.createElement('div');
          bubble.className = 'bubble';

          if (!msg.self) {
            const sender = document.createElement('div');
            sender.className = 'sender';
            sender.textContent = msg.sender;
            bubble.appendChild(sender);
          }

          const text = document.createElement('div');
          text.className = 'text';
          text.textContent = msg.text;
          bubble.appendChild(text);

          const time = document.createElement('div');
          time.className = 'time';
          time.textContent = msg.time;
          bubble.appendChild(time);

          row.appendChild(bubble);
          messagesWrap.appendChild(row);
        });

        messagesWrap.scrollTop = messagesWrap.scrollHeight;
      }

      function saveMessages() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      }

      function openChat() {
        authScreen.classList.remove('active');
        chatScreen.classList.add('active');
        userName.textContent = 'You';
        avatarInitials.textContent = 'Y';
        renderMessages();
      }

      function showError() {
        errorMessage.classList.add('show');
        codeInput.value = '';
        setTimeout(() => errorMessage.classList.remove('show'), 1800);
      }

      function authenticate() {
        const value = codeInput.value.trim();
        if (value === ACCESS_CODE) {
          openChat();
          messageInput.focus();
        } else {
          showError();
        }
      }

      function addMessage(text) {
        const now = new Date();
        const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        messages.push({
          id: Date.now(),
          sender: 'You',
          text,
          time,
          self: true
        });
        saveMessages();
        renderMessages();
      }

      function onSend() {
        const text = messageInput.value.trim();
        if (!text) return;
        addMessage(text);
        messageInput.value = '';
        messageInput.focus();
      }

      async function toggleCamera() {
        if (!cameraOn) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localVideo.srcObject = localStream;
            videoBox.classList.add('show');
            cameraOn = true;
            videoBtn.classList.add('on');
            videoBtn.textContent = 'Camera on';
            mediaState.textContent = micMuted ? 'Mic muted' : 'Mic on';
          } catch (error) {
            alert('Camera access is blocked or unavailable in this browser.');
          }
        } else {
          stopMedia();
          cameraOn = false;
          videoBtn.classList.remove('on');
          videoBtn.textContent = 'Camera';
          mediaState.textContent = 'Camera off';
        }
      }

      function toggleMute() {
        if (!localStream) {
          micMuted = !micMuted;
          mediaState.textContent = micMuted ? 'Mic muted' : 'Mic on';
          muteBtn.classList.toggle('on', micMuted);
          muteBtn.textContent = micMuted ? 'Unmute' : 'Mute';
          return;
        }

        localStream.getAudioTracks().forEach((track) => {
          track.enabled = !track.enabled;
        });

        micMuted = !micMuted;
        muteBtn.classList.toggle('on', micMuted);
        muteBtn.textContent = micMuted ? 'Unmute' : 'Mute';
        mediaState.textContent = micMuted ? 'Mic muted' : 'Mic on';
      }

      function toggleCall() {
        callActive = !callActive;
        callBtn.classList.toggle('on', callActive);
        callBtn.textContent = callActive ? 'End Call' : 'Call';
        document.getElementById('callPill').textContent = callActive ? 'Call active' : 'Live call';
      }

      function stopMedia() {
        if (localStream) {
          localStream.getTracks().forEach((track) => track.stop());
          localStream = null;
        }
        localVideo.srcObject = null;
        videoBox.classList.remove('show');
      }

      document.getElementById('enterBtn').addEventListener('click', authenticate);
      document.getElementById('sendBtn').addEventListener('click', onSend);
      messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          onSend();
        }
      });
      codeInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          authenticate();
        }
      });

      videoBtn.addEventListener('click', toggleCamera);
      muteBtn.addEventListener('click', toggleMute);
      callBtn.addEventListener('click', toggleCall);
    </script>
  </body>
</html>
